<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Please Forgive Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #ffe1ec;
    --bg2: #ffd0e0;
    --bg3: #e9d7ff;
    --ink: #4a1832;
    --pink: #ff4f8b;
    --pink-dark: #d6336c;
    --face: #ffd36e;
    --face-shade: #f5b947;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3), var(--bg1));
    background-size: 400% 400%;
    animation: bgShift 14s ease infinite;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body.scrolly { overflow-y: auto; }
  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* floating hearts + cursor trail */
  .bg-heart {
    position: fixed;
    bottom: -60px;
    pointer-events: none;
    opacity: .55;
    animation: rise linear forwards;
    z-index: 0;
  }
  @keyframes rise {
    to { transform: translate(var(--drift), -115vh) rotate(var(--spin)); opacity: 0; }
  }
  .trail {
    position: fixed;
    pointer-events: none;
    z-index: 6;
    font-size: 14px;
    transform: translate(-50%, -50%);
    animation: trail .8s ease-out forwards;
  }
  @keyframes trail { to { transform: translate(-50%, 20px) scale(.2) rotate(40deg); opacity: 0; } }

  main {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px 16px;
    text-align: center;
  }
  main.quake { animation: quake .5s ease; }
  @keyframes quake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-12px, 6px) rotate(-1deg); }
    40% { transform: translate(10px, -8px) rotate(1deg); }
    60% { transform: translate(-8px, 4px); }
    80% { transform: translate(6px, -2px); }
  }

  /* character */
  .buddy-wrap { position: relative; }
  .buddy { width: min(170px, 40vw); display: block; cursor: pointer; animation: bob 2.6s ease-in-out infinite; }
  .buddy.shake { animation: shake .4s ease; }
  .buddy.spin { animation: spin .7s cubic-bezier(.34,1.56,.64,1); }
  .buddy.happy { animation: dance .9s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px) rotate(-6deg); } 75% { transform: translateX(10px) rotate(6deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes dance {
    0%,100% { transform: translateY(0) rotate(0) scale(1,1); }
    25% { transform: translateY(-26px) rotate(-12deg) scale(.95,1.05); }
    50% { transform: translateY(0) rotate(0) scale(1.08,.92); }
    75% { transform: translateY(-26px) rotate(12deg) scale(.95,1.05); }
  }
  #mouth, .brow { transition: d .3s ease, opacity .3s; }
  .tear { opacity: 0; }
  .crying .tear { opacity: 1; animation: drip 1.1s ease-in infinite; }
  .crying .tear.r { animation-delay: .55s; }
  @keyframes drip { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(46px); opacity: 0; } }
  .eye-happy, .shades { display: none; }
  .happy .eye-open { display: none; }
  .happy .eye-happy { display: inline; }
  .cool .shades { display: inline; }
  .cool .eye-happy { display: none; }
  .happy .brow { opacity: 0; }
  .blush { opacity: 0; transition: opacity .4s; }
  .happy .blush, .hopeful .blush { opacity: .7; }
  .eye-open { transform-origin: center; animation: blink 4.5s infinite; transform-box: fill-box; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }

  .bubble {
    position: absolute;
    left: 88%;
    top: -6px;
    background: #fff;
    padding: 8px 14px;
    border-radius: 18px 18px 18px 4px;
    font-size: 1rem;
    white-space: nowrap;
    box-shadow: 0 6px 18px rgba(74, 24, 50, .15);
    transform: scale(0);
    transform-origin: bottom left;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
    z-index: 4;
  }
  .bubble.show { transform: scale(1); }
  @media (max-width: 560px) {
    .bubble { left: 50%; top: auto; bottom: 102%; transform-origin: bottom center; translate: -50% 0; border-radius: 18px; }
  }

  /* headline */
  h1 {
    margin: 0;
    font-weight: 700;
    line-height: 1.05;
    font-size: clamp(2.4rem, 9vw, 6rem);
    color: var(--pink-dark);
    text-shadow: 0 4px 0 #fff, 0 10px 24px rgba(214, 51, 108, .25);
  }
  h1 .line { display: block; }
  h1 .line.small { font-size: .62em; color: var(--ink); }
  h1 .ch {
    display: inline-block;
    animation: wave 2.4s ease-in-out infinite;
    animation-delay: calc(var(--i) * 70ms);
  }
  h1 .ch.jelly { animation: jelly .6s ease; }
  @keyframes wave {
    0%, 60%, 100% { transform: translateY(0) rotate(0); }
    30% { transform: translateY(-14px) rotate(-4deg); }
  }
  @keyframes jelly {
    0% { transform: scale(1, 1); }
    30% { transform: scale(1.4, .6); color: var(--pink); }
    50% { transform: scale(.7, 1.35) translateY(-12px); }
    70% { transform: scale(1.15, .85); }
    100% { transform: scale(1, 1); }
  }

  .sub {
    margin: 0;
    font-size: clamp(1rem, 3.6vw, 1.35rem);
    min-height: 1.6em;
    opacity: .85;
  }
  .sub.pop { animation: pop .35s ease; }
  @keyframes pop { 50% { transform: scale(1.12); } }

  /* buttons */
  .row { display: flex; gap: 22px; align-items: center; justify-content: center; min-height: 90px; }
  button {
    font: inherit;
    font-weight: 700;
    border: 0;
    cursor: pointer;
    border-radius: 999px;
    padding: 14px 34px;
    font-size: 1.35rem;
    box-shadow: 0 6px 0 rgba(0,0,0,.15), 0 12px 24px rgba(0,0,0,.12);
  }
  #yes {
    background: var(--pink);
    color: #fff;
    transform: scale(var(--grow, 1));
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), background .2s;
    animation: pulse 1.6s ease-in-out infinite;
    position: relative;
    z-index: 3;
  }
  #yes:hover { background: var(--pink-dark); }
  #yes:active { box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  @keyframes pulse { 0%,100% { box-shadow: 0 6px 0 rgba(0,0,0,.15), 0 0 0 0 rgba(255,79,139,.55); } 50% { box-shadow: 0 6px 0 rgba(0,0,0,.15), 0 0 0 16px rgba(255,79,139,0); } }

  #no {
    background: #fff;
    color: var(--ink);
    white-space: nowrap;
    z-index: 4;
    cursor: not-allowed;
    transition: left .32s cubic-bezier(.34,1.56,.64,1), top .32s cubic-bezier(.34,1.56,.64,1), transform .32s ease, opacity .4s;
  }
  /* tiny running legs */
  #no::before, #no::after {
    content: "";
    position: absolute;
    bottom: -13px;
    width: 5px;
    height: 15px;
    border-radius: 3px;
    background: var(--ink);
    transform-origin: top center;
    opacity: 0;
    transition: opacity .15s;
  }
  #no::before { left: 36%; }
  #no::after { right: 36%; }
  #no.moving::before, #no.moving::after { opacity: 1; animation: legs .12s linear infinite alternate; }
  #no.moving::after { animation-direction: alternate-reverse; }
  @keyframes legs { from { transform: rotate(-35deg); } to { transform: rotate(35deg); } }
  #no.fall { transition: top 1.1s cubic-bezier(.55,0,1,.45), transform 1.1s ease-in; }

  .decoy {
    position: fixed;
    z-index: 4;
    background: #fff;
    color: var(--ink);
    animation: decoyIn .45s cubic-bezier(.34,1.56,.64,1);
    transition: transform .4s cubic-bezier(.34,1.56,.64,1), background .2s, color .2s;
  }
  .decoy.flipped { background: var(--pink); color: #fff; transform: rotateY(360deg) scale(1.1); }
  @keyframes decoyIn { from { transform: scale(0) rotate(-90deg); } }

  .puff {
    position: fixed;
    pointer-events: none;
    font-size: 1.6rem;
    z-index: 2;
    transform: translate(-50%, -50%);
    animation: puff .7s ease-out forwards;
  }
  @keyframes puff { to { transform: translate(-50%, -50%) scale(2); opacity: 0; } }

  .mute {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 7;
    padding: 8px 12px;
    font-size: 1.2rem;
    background: rgba(255,255,255,.75);
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
  }

  /* installing forgiveness */
  .install, .win { display: none; flex-direction: column; align-items: center; gap: 12px; width: min(440px, 100%); }
  .installing .install { display: flex; animation: zoomIn .5s cubic-bezier(.34,1.56,.64,1); }
  .installing .ask, .done .ask, .done .install { display: none; }
  .done .win { display: flex; animation: zoomIn .6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes zoomIn { from { transform: scale(.3); opacity: 0; } }
  .install h2 { margin: 0; font-size: clamp(1.4rem, 5vw, 2rem); }
  .bar { width: 100%; height: 26px; border-radius: 999px; background: #fff; padding: 4px; box-shadow: inset 0 2px 6px rgba(0,0,0,.1); }
  .bar i {
    display: block; height: 100%; width: 0; border-radius: 999px;
    background: repeating-linear-gradient(45deg, var(--pink) 0 12px, #ff7aa8 12px 24px);
    background-size: 34px 34px;
    animation: stripes .6s linear infinite;
    transition: width .25s ease;
  }
  @keyframes stripes { to { background-position: 34px 0; } }
  .step { margin: 0; font-size: 1.05rem; min-height: 1.5em; }

  /* the win screen */
  .win h2 { margin: 0; font-size: clamp(2rem, 7vw, 3.6rem); color: var(--pink-dark); text-shadow: 0 4px 0 #fff; }
  .win p { margin: 0; font-size: clamp(1rem, 3.6vw, 1.3rem); }
  .cert {
    position: relative;
    width: 100%;
    background: #fffdf6;
    border: 3px double var(--pink-dark);
    border-radius: 14px;
    padding: 18px 20px 22px;
    box-shadow: 0 14px 30px rgba(74, 24, 50, .18);
    transform: rotate(-1.5deg);
  }
  .cert h3 { margin: 0 0 6px; font-size: 1.1rem; letter-spacing: .08em; text-transform: uppercase; color: var(--pink-dark); }
  .cert .hand { font-family: "Caveat", cursive; font-size: 1.7rem; line-height: 1.2; }
  .cert small { display: block; margin-top: 8px; opacity: .7; }
  .stamp {
    position: absolute;
    right: -10px;
    bottom: -18px;
    padding: 6px 12px;
    border: 4px solid var(--pink-dark);
    border-radius: 10px;
    color: var(--pink-dark);
    font-weight: 700;
    font-size: 1.1rem;
    background: rgba(255,255,255,.6);
    transform: rotate(-14deg);
    animation: stamp .5s 1s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes stamp { from { transform: rotate(-14deg) scale(4); opacity: 0; } }
  #hug { background: var(--pink); color: #fff; font-size: 1.15rem; padding: 12px 26px; margin-top: 14px; }
  #hug:active { transform: scale(.94); }

  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<button class="mute" id="mute" aria-label="Toggle sound">🔊</button>

<main id="stage">
  <div class="buddy-wrap">
    <div class="bubble" id="bubble"></div>
    <svg class="buddy" id="buddy" viewBox="0 0 200 200" aria-hidden="true">
      <ellipse cx="100" cy="190" rx="58" ry="8" fill="rgba(0,0,0,.08)"/>
      <circle cx="100" cy="100" r="80" fill="var(--face)"/>
      <path d="M40 130 A80 80 0 0 0 160 130 A70 60 0 0 1 40 130Z" fill="var(--face-shade)" opacity=".5"/>
      <ellipse class="blush" cx="52" cy="120" rx="14" ry="8" fill="#ff7aa2"/>
      <ellipse class="blush" cx="148" cy="120" rx="14" ry="8" fill="#ff7aa2"/>
      <path class="brow" id="browL" d="M52 60 L82 70" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
      <path class="brow" id="browR" d="M148 60 L118 70" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
      <g class="eye-open">
        <circle cx="70" cy="92" r="17" fill="#fff"/>
        <circle cx="130" cy="92" r="17" fill="#fff"/>
        <g id="pupils">
          <circle cx="70" cy="93" r="10" fill="var(--ink)"/>
          <circle cx="130" cy="93" r="10" fill="var(--ink)"/>
          <circle cx="74" cy="88" r="3.5" fill="#fff"/>
          <circle cx="134" cy="88" r="3.5" fill="#fff"/>
        </g>
      </g>
      <g class="eye-happy" stroke="var(--ink)" stroke-width="6" fill="none" stroke-linecap="round">
        <path d="M56 96 Q70 80 84 96"/>
        <path d="M116 96 Q130 80 144 96"/>
      </g>
      <g class="shades">
        <path d="M44 80 H94 L90 104 Q70 114 50 104Z M106 80 H156 L150 104 Q130 114 110 104Z" fill="#1d1d1f"/>
        <path d="M94 86 H106" stroke="#1d1d1f" stroke-width="5"/>
        <path d="M54 86 L66 86" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
        <path d="M116 86 L128 86" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
      </g>
      <path class="tear l" d="M62 110 q-6 10 0 14 q6 -4 0 -14z" fill="#6ec6ff"/>
      <path class="tear r" d="M138 110 q-6 10 0 14 q6 -4 0 -14z" fill="#6ec6ff"/>
      <path id="mouth" d="M75 142 Q100 130 125 142" stroke="var(--ink)" stroke-width="6" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="ask">
    <h1 id="title" aria-label="I'm sorry, please forgive me">
      <span class="line">I'm sorry,</span>
      <span class="line small">please forgive me</span>
    </h1>
  </div>
  <p class="sub ask" id="sub">Pretty please? 🥺</p>
  <div class="row ask">
    <button id="yes">Yes 💖</button>
    <button id="no" tabindex="-1">No</button>
  </div>

  <div class="install">
    <h2>Installing forgiveness.exe 💾</h2>
    <div class="bar"><i id="barFill"></i></div>
    <p class="step" id="step">Starting up...</p>
  </div>

  <div class="win">
    <h2>Yaaay! 🎉</h2>
    <p id="winMsg">I knew you'd forgive me 💕</p>
    <div class="cert">
      <h3>Official Certificate of Forgiveness</h3>
      <div class="hand">This certifies that you are the kindest human ever, and that I am <u>officially forgiven</u>.</div>
      <small id="certMeta"></small>
      <div class="stamp">APPROVED 💖</div>
    </div>
    <button id="hug">Send a hug 🤗</button>
  </div>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const stage = $('#stage'), yes = $('#yes'), no = $('#no'), sub = $('#sub');
  const buddy = $('#buddy'), mouth = $('#mouth'), browL = $('#browL'), browR = $('#browR');
  const pupils = $('#pupils'), bubble = $('#bubble');
  const rand = (a) => a[Math.random() * a.length | 0];

  /* ---------- sound (tiny synth, no files) ---------- */
  let ac = null, muted = false;
  const unlock = () => { ac ||= new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); };
  addEventListener('pointerdown', unlock, { once: true });
  addEventListener('keydown', unlock, { once: true });
  function tone(f1, f2, dur, type = 'sine', vol = .12, delay = 0) {
    if (muted || !ac || ac.state !== 'running') return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + .02);
  }
  const sfx = {
    boing: () => tone(180 + Math.random() * 120, 700 + Math.random() * 400, .2, 'triangle'),
    pop: () => tone(600, 1400, .08, 'square', .06),
    giggle: () => [0, .09, .18, .27].forEach((d, i) => tone(900 - i * 60, 1300 - i * 60, .07, 'sine', .08, d)),
    sad: () => tone(400, 180, .5, 'sawtooth', .04),
    blip: () => tone(500 + Math.random() * 500, 520 + Math.random() * 500, .05, 'square', .03),
    fanfare: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, f * 1.01, i === 5 ? .6 : .16, 'triangle', .12, i * .14)),
  };
  $('#mute').addEventListener('click', (e) => {
    muted = !muted;
    e.currentTarget.textContent = muted ? '🔇' : '🔊';
  });

  /* ---------- wavy, squishy letters ---------- */
  document.querySelectorAll('#title .line').forEach((line, li) => {
    const text = line.textContent;
    line.textContent = '';
    [...text].forEach((c, i) => {
      const s = document.createElement('span');
      s.className = 'ch';
      s.style.setProperty('--i', i + li * 10);
      s.textContent = c === ' ' ? ' ' : c;
      s.setAttribute('aria-hidden', 'true');
      s.addEventListener('pointerenter', () => {
        if (s.classList.contains('jelly')) return;
        s.classList.add('jelly');
        sfx.blip();
        s.addEventListener('animationend', () => s.classList.remove('jelly'), { once: true });
      });
      line.appendChild(s);
    });
  });

  /* ---------- floating hearts + cursor trail ---------- */
  const hearts = ['💗', '💕', '💖', '🌸', '💞', '✨'];
  function spawnHeart() {
    const h = document.createElement('div');
    h.className = 'bg-heart';
    h.textContent = rand(hearts);
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = 14 + Math.random() * 26 + 'px';
    h.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
    h.style.setProperty('--spin', (Math.random() * 120 - 60) + 'deg');
    h.style.animationDuration = 7 + Math.random() * 7 + 's';
    document.body.appendChild(h);
    h.addEventListener('animationend', () => h.remove());
  }
  for (let i = 0; i < 10; i++) setTimeout(spawnHeart, i * 300);
  setInterval(spawnHeart, 700);

  let lastTrail = 0;
  function trail(x, y) {
    const now = performance.now();
    if (now - lastTrail < 45) return;
    lastTrail = now;
    const t = document.createElement('div');
    t.className = 'trail';
    t.textContent = rand(['💗', '💕', '✨']);
    t.style.left = x + 'px'; t.style.top = y + 'px';
    document.body.appendChild(t);
    t.addEventListener('animationend', () => t.remove());
  }

  /* ---------- buddy: face, eyes, speech ---------- */
  let sadLevel = 0, bubbleTimer;
  function say(text, ms = 1800) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
  }
  function drawFace(level) {
    // level < 0 : hopeful smile, 0..5 : increasingly sad
    if (level < 0) {
      mouth.setAttribute('d', 'M72 136 Q100 160 128 136');
      browL.setAttribute('d', 'M54 62 L82 58');
      browR.setAttribute('d', 'M146 62 L118 58');
      buddy.classList.add('hopeful');
      buddy.classList.remove('crying');
      return;
    }
    const dip = Math.min(level, 5);
    mouth.setAttribute('d', `M${75 - dip * 2} ${142 + dip} Q100 ${130 - dip * 5} ${125 + dip * 2} ${142 + dip}`);
    browL.setAttribute('d', `M52 ${60 + dip * 2} L82 ${70 - dip * 2}`);
    browR.setAttribute('d', `M148 ${60 + dip * 2} L118 ${70 - dip * 2}`);
    buddy.classList.remove('hopeful');
    buddy.classList.toggle('crying', level >= 3);
  }
  function anim(el, cls) { el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }
  buddy.addEventListener('animationend', (e) => {
    if (e.animationName === 'shake' || e.animationName === 'spin') buddy.classList.remove('shake', 'spin');
  });
  buddy.addEventListener('click', () => {
    if (buddy.classList.contains('happy')) { buddy.classList.toggle('cool'); say(buddy.classList.contains('cool') ? 'Deal with it 😎' : 'Okay okay 😆'); sfx.pop(); return; }
    anim(buddy, 'spin');
    sfx.giggle();
    say(rand(['Hehe, that tickles! 🤭', 'Boop! 👉', 'Wheee! 🌀', 'Focus! Click Yes 😤']));
  });
  setTimeout(() => say('Hi... 👉👈'), 900);

  /* ---------- the running NO ---------- */
  const noTexts = ['No', 'Are you sure?', 'Really?? 😳', 'Think again!', 'Pleeease 🥺', 'Nope 🙅', "Can't catch me!", 'Too slow 😜',
    "I'll cry 😭", 'Wrong button!', 'Try Yes instead', 'Still no?', 'Nice try 😏', 'Not happening', 'Give up? 💕', 'zoom zoom 🏃'];
  const subTexts = ['Pretty please? 🥺', 'That button seems shy...', 'Hey! Come back! 😅', "It doesn't want to be clicked", 'Yes is getting bigger 👀',
    'My heart is breaking 💔', 'I made you cookies 🍪', 'I promise to be better!', 'The No buttons are multiplying?!', "Okay, now you're just playing 😂",
    "There's only one real answer 💖"];
  const buddyLines = ['Wait no! 😰', 'Noooo 😭', 'Why tho 🥲', 'My poor heart 💔', 'Sniff... 😢', '*sad noises*', 'I will do the dishes! 🧽',
    'Breakfast in bed? 🥞', 'I got you flowers 💐', 'Puppy eyes activated 🥺'];
  let dodges = 0, running = false, done = false, lastFlee = 0, moveTimer, hopeful = false;

  function startRunning() {
    if (running) return;
    const r = no.getBoundingClientRect();
    // leave a ghost so Yes doesn't jump
    const ghost = document.createElement('span');
    ghost.style.cssText = `display:inline-block;width:${r.width}px;height:${r.height}px`;
    no.after(ghost);
    Object.assign(no.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', margin: 0 });
    document.body.appendChild(no);
    running = true;
  }

  function puff(x, y) {
    const p = document.createElement('div');
    p.className = 'puff';
    p.textContent = rand(['💨', '✨', '💫']);
    p.style.left = x + 'px'; p.style.top = y + 'px';
    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }

  function farSpot(w, h, px, py, minDist = 260) {
    const pad = 12, maxX = innerWidth - w - pad, maxY = innerHeight - h - pad;
    let x, y, tries = 0;
    do {
      x = pad + Math.random() * Math.max(maxX - pad, 1);
      y = pad + Math.random() * Math.max(maxY - pad, 1);
    } while (Math.hypot(x + w / 2 - px, y + h / 2 - py) < minDist && ++tries < 40);
    return [x, y];
  }

  function flee(px, py) {
    if (done) return;
    const now = performance.now();
    if (now - lastFlee < 120) return;
    lastFlee = now;
    startRunning();

    const r = no.getBoundingClientRect();
    puff(r.left + r.width / 2, r.top + r.height / 2);
    sfx.boing();

    dodges++;
    no.textContent = noTexts[Math.min(dodges, noTexts.length - 1)];
    sub.textContent = subTexts[Math.min(dodges, subTexts.length - 1)];
    anim(sub, 'pop');
    yes.style.setProperty('--grow', Math.min(1 + dodges * 0.1, 2.3));
    sadLevel = Math.ceil(dodges / 2);
    drawFace(sadLevel);
    anim(buddy, 'shake');
    if (dodges % 2 === 1) say(buddyLines[Math.min((dodges - 1) / 2 | 0, buddyLines.length - 1)]);
    if (dodges === 6) sfx.sad();

    // special tricks
    if (dodges === 7) anim(stage, 'quake');
    if (dodges === 6 || dodges === 9 || dodges === 12) spawnDecoy(px, py);
    if (dodges === 10) {
      no.style.opacity = .12;
      sub.textContent = 'Where did it go? 👀';
      setTimeout(() => (no.style.opacity = 1), 1600);
    }

    // measure after text change
    const w = no.offsetWidth, h = no.offsetHeight, pad = 12;
    const maxX = innerWidth - w - pad, maxY = innerHeight - h - pad;
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = cx - px, dy = cy - py, d = Math.hypot(dx, dy) || 1;
    const jump = 150 + Math.random() * 130;
    let nx = r.left + (dx / d) * jump + (Math.random() * 80 - 40);
    let ny = r.top + (dy / d) * jump + (Math.random() * 80 - 40);

    // cornered (or feeling cheeky) -> teleport far away
    if (nx < pad || nx > maxX || ny < pad || ny > maxY || Math.random() < 0.15) [nx, ny] = farSpot(w, h, px, py);

    no.style.left = nx + 'px';
    no.style.top = ny + 'px';
    const shrink = Math.max(1 - dodges * 0.025, 0.65);
    const spin = Math.random() < .2 ? 360 : 0;
    no.style.transform = `rotate(${spin + Math.random() * 30 - 15}deg) scale(${shrink})`;
    no.classList.add('moving');
    clearTimeout(moveTimer);
    moveTimer = setTimeout(() => no.classList.remove('moving'), 420);
  }

  // decoy "No"s that secretly flip into Yes
  const decoys = [];
  function spawnDecoy(px, py) {
    const b = document.createElement('button');
    b.className = 'decoy';
    b.textContent = 'No';
    b.tabIndex = -1;
    document.body.appendChild(b);
    const [x, y] = farSpot(b.offsetWidth, b.offsetHeight, px, py, 200);
    b.style.left = x + 'px'; b.style.top = y + 'px';
    decoys.push(b);
    sfx.pop();
    b.addEventListener('pointerenter', () => {
      if (b.classList.contains('flipped') || done) return;
      b.classList.add('flipped');
      b.textContent = 'Yes 😘';
      sfx.giggle();
      say('Gotcha! 😜');
      sub.textContent = 'Hehe, that one was a Yes in disguise';
    });
    b.addEventListener('click', accept);
  }

  // dodge when the cursor gets near; eyes follow; hearts trail
  document.addEventListener('pointermove', (e) => {
    trail(e.clientX, e.clientY);
    const b = buddy.getBoundingClientRect();
    const ex = e.clientX - (b.left + b.width / 2), ey = e.clientY - (b.top + b.height * .46);
    const ed = Math.hypot(ex, ey) || 1, m = Math.min(ed / 30, 6);
    pupils.setAttribute('transform', `translate(${(ex / ed) * m} ${(ey / ed) * m})`);

    if (done || e.pointerType === 'touch') return;
    const r = no.getBoundingClientRect();
    const nearX = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    const nearY = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    if (Math.hypot(nearX, nearY) < 70) flee(e.clientX, e.clientY);
  });

  // if anything somehow reaches it: still nope
  ['pointerdown', 'touchstart', 'mousedown', 'click', 'focus'].forEach((ev) =>
    no.addEventListener(ev, (e) => {
      e.preventDefault();
      e.stopPropagation();
      const t = e.touches?.[0];
      const r = no.getBoundingClientRect();
      flee(t ? t.clientX : (e.clientX || r.left + r.width / 2), t ? t.clientY : (e.clientY || r.top + r.height / 2));
      no.blur();
    }, { passive: false })
  );
  addEventListener('resize', () => {
    if (!running) return;
    const r = no.getBoundingClientRect();
    no.style.left = Math.max(12, Math.min(r.left, innerWidth - r.width - 12)) + 'px';
    no.style.top = Math.max(12, Math.min(r.top, innerHeight - r.height - 12)) + 'px';
  });

  // hovering Yes gives buddy hope
  yes.addEventListener('pointerenter', () => {
    if (done) return;
    hopeful = true;
    drawFace(-1);
    say(rand(['Ooh?! 😳', 'Yes yes yes! 🤞', 'Do it do it! 🥹', 'Is that a yes?! 👀']), 1400);
  });
  yes.addEventListener('pointerleave', () => {
    if (done || !hopeful) return;
    hopeful = false;
    drawFace(sadLevel);
  });

  // click anywhere for little heart pops
  addEventListener('pointerdown', (e) => {
    if (e.target.closest('button') || e.target.closest('.buddy')) return;
    burst(e.clientX, e.clientY, 14, .5);
    sfx.pop();
  });

  /* ---------- YES 💖 ---------- */
  const steps = ['Deleting grudges... 🗑️', 'Loading hugs... 🤗', 'Downloading cuddles... 📥', 'Patching up feelings... 🩹',
    'Ordering pizza for apology... 🍕', 'Removing pouty face... 😤➡️😊', 'Almost there... 💞'];
  function accept() {
    if (done) return;
    done = true;
    clearTimeout(bubbleTimer);
    bubble.classList.remove('show');
    buddy.classList.remove('crying', 'shake', 'spin');
    drawFace(-1);
    sfx.pop();

    // NO + decoys fall off the screen in defeat
    const fall = (b, txt) => {
      b.textContent = txt;
      b.classList.add('fall');
      b.style.transition = 'top 1.1s cubic-bezier(.55,0,1,.45), transform 1.1s ease-in';
      b.style.top = innerHeight + 200 + 'px';
      b.style.transform = `rotate(${200 + Math.random() * 80}deg) scale(.6)`;
    };
    if (running) fall(no, 'okay fine 😔'); else no.style.visibility = 'hidden';
    decoys.forEach((d) => fall(d, d.classList.contains('flipped') ? 'Yes 😘' : 'nooo'));

    stage.classList.add('installing');
    const fill = $('#barFill'), step = $('#step');
    let pct = 0, i = 0;
    const tick = setInterval(() => {
      pct = Math.min(100, pct + 4 + Math.random() * 10);
      fill.style.width = pct + '%';
      if (Math.random() < .45 && i < steps.length) step.textContent = steps[i++];
      sfx.blip();
      if (pct >= 100) {
        clearInterval(tick);
        step.textContent = 'Done! ✅';
        setTimeout(celebrate, 400);
      }
    }, 220);
  }
  yes.addEventListener('click', accept);

  function celebrate() {
    stage.classList.remove('installing');
    stage.classList.add('done');
    document.body.classList.add('scrolly');
    buddy.classList.remove('hopeful');
    buddy.classList.add('happy');
    $('#winMsg').textContent = dodges > 5
      ? `You chased No ${dodges} times... but you picked YES! 💕`
      : rand(["I knew you'd forgive me. You're the best! 💕", 'Best decision ever. Hug incoming 🤗', 'Thank you! I owe you ice cream 🍦']);
    $('#certMeta').textContent = `Issued ${new Date().toLocaleDateString(undefined, { dateStyle: 'long' })} · Valid forever · Non-refundable`;
    sfx.fanfare();
    burst(innerWidth / 2, innerHeight / 2);
    setTimeout(() => burst(innerWidth * .2, innerHeight * .35), 250);
    setTimeout(() => burst(innerWidth * .8, innerHeight * .35), 450);
    rainStart = performance.now();
    setTimeout(() => say('Best. Day. Ever. 🥳', 2500), 700);
  }

  let hugs = 0;
  $('#hug').addEventListener('click', (e) => {
    hugs++;
    const r = e.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, 40, .8);
    sfx.giggle();
    say(hugs > 4 ? `${hugs} hugs?! I'm melting 🫠` : rand(['Squeeeze! 🤗', 'Hug received 💌', 'Aww 🥰', 'One more! 😊']));
    e.currentTarget.textContent = `Send a hug 🤗 ×${hugs}`;
  });

  /* ---------- confetti + hearts canvas ---------- */
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let parts = [], rainStart = 0;
  const fit = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); };
  fit(); addEventListener('resize', fit);
  const colors = ['#ff4f8b', '#ffd36e', '#9b6bff', '#4fd1c5', '#ff9f43', '#ffffff'];

  function burst(x, y, n = 90, power = 1) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (4 + Math.random() * 9) * power;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4 * power, life: 1, heart: Math.random() < (power < 1 ? .8 : .35),
        size: 6 + Math.random() * 8, rot: Math.random() * 6, vr: Math.random() * .3 - .15, c: rand(colors) });
    }
  }
  function drawHeart(s) {
    ctx.beginPath();
    ctx.moveTo(0, s * .3);
    ctx.bezierCurveTo(0, 0, -s * .5, 0, -s * .5, s * .3);
    ctx.bezierCurveTo(-s * .5, s * .6, 0, s * .8, 0, s);
    ctx.bezierCurveTo(0, s * .8, s * .5, s * .6, s * .5, s * .3);
    ctx.bezierCurveTo(s * .5, 0, 0, 0, 0, s * .3);
    ctx.fill();
  }
  (function loop(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (rainStart && t - rainStart < 4000 && Math.random() < .6) {
      parts.push({ x: Math.random() * innerWidth, y: -20, vx: Math.random() * 2 - 1, vy: 2, life: 1.4, heart: true,
        size: 10 + Math.random() * 12, rot: 0, vr: Math.random() * .1 - .05, c: colors[Math.random() * 3 | 0] });
    }
    parts = parts.filter((p) => p.life > 0 && p.y < innerHeight + 40);
    for (const p of parts) {
      p.vy += .18; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .006;
      ctx.save();
      ctx.globalAlpha = Math.min(p.life, 1);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.heart) drawHeart(p.size * 1.6); else ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    }
    requestAnimationFrame(loop);
  })(0);
})();
</script>
</body>
</html>
